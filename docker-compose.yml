# docker-compose.yml — local development and single-host deployment.
#
# Usage:
#   cp .env.example .env
#   # edit .env to fill in JWT_SECRET and ADMIN_TOKEN
#   docker compose up --build
#
# JSON persistence lives in a named volume so the server's user
# records survive container restarts. To wipe state:
#   docker compose down -v

services:
  cherubgyre:
    build:
      context: .
      dockerfile: Dockerfile
    image: cherubgyre:local
    container_name: cherubgyre
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - cherubgyre-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  cherubgyre-data:
