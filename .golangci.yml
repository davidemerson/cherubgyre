version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors — covered by errcheck with finer granularity
        - G706 # log injection — mitigated at runtime by controllers.sanitizeForLog
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
